<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>지식베이스 대시보드</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Segoe UI', sans-serif;
      background: #eef1f7;
      color: #333;
      min-height: 100vh;
    }

    /* ── 헤더 ── */
    .header {
      background: linear-gradient(135deg, #1a1a2e 0%, #16213e 60%, #0f3460 100%);
      padding: 28px 48px;
      display: flex;
      align-items: center;
      gap: 14px;
    }
    .header h1 { font-size: 22px; font-weight: 700; color: #fff; letter-spacing: .3px; }
    .header .dot {
      width: 10px; height: 10px; border-radius: 50%;
      background: #4ade80; box-shadow: 0 0 8px #4ade80;
      animation: pulse 2s infinite;
    }
    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: .4; } }
    .header .sub { margin-left: auto; font-size: 12px; color: rgba(255,255,255,.4); }

    /* ── 서비스 상태 바 ── */
    .service-bar {
      background: #13172a;
      padding: 10px 48px;
      display: flex;
      align-items: center;
      gap: 20px;
    }
    .service-bar .svc-label { font-size: 11px; color: rgba(255,255,255,.3); text-transform: uppercase; letter-spacing: .8px; margin-right: 4px; }
    .svc-pill {
      display: inline-flex; align-items: center; gap: 6px;
      padding: 4px 12px; border-radius: 20px; font-size: 12px; font-weight: 600;
    }
    .svc-pill .svc-dot { width: 7px; height: 7px; border-radius: 50%; }
    .svc-pill.active   { background: rgba(74,222,128,.12); color: #4ade80; }
    .svc-pill.active .svc-dot { background: #4ade80; box-shadow: 0 0 6px #4ade80; animation: pulse 2s infinite; }
    .svc-pill.inactive { background: rgba(248,113,113,.12); color: #f87171; }
    .svc-pill.inactive .svc-dot { background: #f87171; }
    .svc-pill.unknown  { background: rgba(255,255,255,.06); color: rgba(255,255,255,.4); }
    .svc-pill.unknown .svc-dot { background: rgba(255,255,255,.3); }

    /* ── 본문 ── */
    .body { padding: 36px 48px; }

    /* ── 그리드 ── */
    .grid {
      display: grid;
      grid-template-columns: 2.3fr 2fr 0.9fr 0.9fr;
      grid-template-areas:
        "success  team-uploads  total-files  chunks"
        "success  team-uploads  right-col    right-col"
        "success  team-uploads  right-col    right-col"
        "times    rebuild       right-col    right-col";
      gap: 20px;
      margin-bottom: 28px;
    }

    /* ── 카드 공통 ── */
    .card {
      background: #fff;
      border-radius: 16px;
      padding: 28px 32px;
      box-shadow: 0 4px 6px rgba(0,0,0,.06), 0 10px 20px rgba(0,0,0,.07);
      transition: transform .15s, box-shadow .15s;
    }
    .card:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 12px rgba(0,0,0,.08), 0 16px 28px rgba(0,0,0,.09);
    }
    .card .label { font-size: 14px; font-weight: 700; color: #334; margin-bottom: 10px; }
    .card .value      { font-size: 38px; font-weight: 700; color: #1a1a2e; }
    .card .value.md   { font-size: 20px; font-weight: 600; color: #1a1a2e; padding-top: 2px; }
    .card .sub        { font-size: 12px; color: #bbb; margin-top: 6px; }

    .card.accent-blue   { border-left: 4px solid #3d5a80; }
    .card.accent-green  { border-left: 4px solid #3d5a80; }
    .card.accent-purple { border-left: 4px solid #3d5a80; }
    .card.accent-orange { border-left: 4px solid #3d5a80; }

    /* ── 성공 카드 ── */
    .card-success { grid-area: success; align-self: stretch; padding: 20px 24px; }

    .ring-wrap { display: flex; justify-content: center; margin: 12px 0 6px; }
    .ring-wrap svg { width: 280px; height: 280px; }
    .ring-bg    { fill: none; stroke: #f0f1f5; stroke-width: 12; }
    .ring-track { fill: none; stroke-width: 12; stroke-linecap: round;
                  transform: rotate(-90deg); transform-origin: 50% 50%;
                  transition: stroke-dasharray .8s cubic-bezier(.4,0,.2,1), stroke .4s ease; }
    .ring-label { font-size: 20px; font-weight: 700; fill: #1a1a2e;
                  dominant-baseline: middle; text-anchor: middle; }
    .ring-sub   { font-size: 9px; fill: #aab; dominant-baseline: middle; text-anchor: middle;
                  text-transform: uppercase; letter-spacing: .6px; }

    /* 누적 바 */
    .stack-bar { display: flex; height: 8px; border-radius: 4px; overflow: hidden; margin: 14px 0 6px; gap: 2px; }
    .stack-bar .seg { border-radius: 4px; transition: width .6s ease; }
    .stack-legend { display: flex; gap: 16px; margin-top: 10px; }
    .stack-legend .leg { display: flex; align-items: center; gap: 5px; font-size: 12px; color: #778; }
    .stack-legend .leg .dot { width: 8px; height: 8px; border-radius: 2px; }

    .mini-stats { display: flex; gap: 28px; margin-top: 18px; padding-top: 18px; border-top: 1px solid #f0f1f5; }
    .mini-stat .mini-label { font-size: 11px; color: #bbb; text-transform: uppercase; letter-spacing: .4px; margin-bottom: 4px; }
    .mini-stat .mini-value { font-size: 22px; font-weight: 600; color: #667; }
    .mini-stat .mini-value.err { color: #e53935; }

    /* 상태 배지 */
    .badges { display: flex; gap: 8px; margin-top: 14px; flex-wrap: wrap; }
    .badge { display: inline-flex; align-items: center; gap: 5px;
             padding: 4px 12px; border-radius: 20px; font-size: 12px; font-weight: 600; }
    .badge::before { content:''; width:6px; height:6px; border-radius:50%; }
    .badge.ok     { background: #f0fdf4; color: #16a34a; }
    .badge.ok::before { background: #4ade80; }
    .badge.warn   { background: #fff7ed; color: #ea580c; }
    .badge.warn::before { background: #fb923c; }
    .badge.busy   { background: #eff6ff; color: #2563eb; }
    .badge.busy::before { background: #60a5fa; animation: pulse 1.2s infinite; }

    /* ── 그 외 카드 ── */
    .card-total-files  { grid-area: total-files; }
    .card-chunks-count { grid-area: chunks; }
    .card-times        { grid-area: times; display: flex; flex-direction: column; align-self: stretch; }
    .card-team-uploads { grid-area: team-uploads; align-self: stretch; display: flex; flex-direction: column; }
    .card-team-uploads #user-chart { flex: 1; display: flex; flex-direction: column; justify-content: flex-end; min-height: 0; }
    .card-indexed { padding: 18px 24px; }
    .card-rebuild  { grid-area: rebuild; align-self: stretch; padding: 18px 24px; }
    .card-right-col { grid-area: right-col; display: flex; flex-direction: column; gap: 20px; }
    .card-pending  { padding: 18px 24px; }
    .card-ext      { flex: 1; min-height: 0; display: flex; flex-direction: column; }

    /* ── 차트 ── */
    .chart-title { font-size: 14px; font-weight: 700; color: #334; margin-bottom: 18px; }
    .bar-row { display: flex; align-items: center; gap: 10px; margin-bottom: 11px; }
    .bar-label { width: 68px; font-size: 12px; color: #667; text-align: left; flex-shrink: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .bar-track { flex: 1; height: 10px; background: #f0f1f5; border-radius: 5px; overflow: hidden; }
    .bar-fill  { height: 100%; border-radius: 5px; transition: width .7s cubic-bezier(.4,0,.2,1); }
    .bar-count { font-size: 12px; color: #aab; flex-shrink: 0; width: 36px; text-align: right; }

    /* 세로 바 차트 */
    .v-chart-wrap { display: flex; align-items: flex-end; gap: 10px; height: 100%; min-height: 180px; }
    .v-bar-col  { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; height: 100%; min-width: 0; }
    .v-bar-val  { font-size: 11px; color: #aab; margin-bottom: 5px; white-space: nowrap; }
    .v-bar-fill { width: 60%; border-radius: 5px 5px 0 0; transition: height .7s cubic-bezier(.4,0,.2,1); min-height: 3px; }
    .v-bar-name { font-size: 11px; color: #667; margin-top: 7px; text-align: center; max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

    /* ── 버튼 ── */
    button { padding: 13px 32px; width: 192px; border: none; border-radius: 12px; font-size: 17px; font-weight: 600; cursor: pointer; transition: all .15s; }
    button:hover { filter: brightness(1.1); transform: translateY(-1px); }
    button:active { transform: translateY(0); }
    .btn-primary   { background: #3d5a80; color: #fff; box-shadow: 0 2px 8px rgba(61,90,128,.3); }
    .btn-secondary { background: #5c8a6e; color: #fff; box-shadow: 0 2px 8px rgba(92,138,110,.3); }

    .refresh-info { font-size: 12px; color: #ccc; margin-top: 20px; text-align: right; }
    #toast { position: fixed; bottom: 28px; right: 28px; background: #1a1a2e; color: #fff;
             padding: 12px 22px; border-radius: 12px; font-size: 14px; font-weight: 500;
             opacity: 0; transition: opacity .3s; pointer-events: none;
             box-shadow: 0 8px 24px rgba(0,0,0,.2); }
  </style>
</head>
<body>

  <div class="header">
    <div class="dot"></div>
    <h1>지식베이스 대시보드</h1>
    <span class="sub" id="header_time"></span>
  </div>

  <div class="service-bar">
    <span class="svc-label">서비스</span>
    <div class="svc-pill active">
      <div class="svc-dot"></div>MCP 서버
    </div>
    <div class="svc-pill unknown" id="svc-watcher">
      <div class="svc-dot"></div>Watcher
    </div>
  </div>

  <div class="body">
    <div class="grid">

      <!-- col1 rows 1-3: 성공률 -->
      <div class="card card-success">
        <div class="label">성공률 (현재 상태)</div>
        <div class="ring-wrap">
          <svg viewBox="0 0 120 120">
            <circle class="ring-bg"    cx="60" cy="60" r="50"/>
            <circle class="ring-track" cx="60" cy="60" r="50" id="ring-track"
                    stroke-dasharray="0 314" stroke="#4ade80"/>
            <text class="ring-label" x="60" y="56" id="ring-label">-</text>
            <text class="ring-sub"   x="60" y="70">success rate</text>
          </svg>
        </div>
        <div class="stack-bar" id="stack-bar">
          <div class="seg" style="background:#4ade80;width:0%"></div>
          <div class="seg" style="background:#fb923c;width:0%"></div>
          <div class="seg" style="background:#f87171;width:0%"></div>
        </div>
        <div class="stack-legend">
          <div class="leg"><div class="dot" style="background:#4ade80"></div><span id="legend-success">성공 -</span></div>
          <div class="leg"><div class="dot" style="background:#fb923c"></div><span id="legend-skip">스킵 -</span></div>
          <div class="leg"><div class="dot" style="background:#f87171"></div><span id="legend-error">오류 -</span></div>
        </div>
        <div class="mini-stats">
          <div class="mini-stat">
            <div class="mini-label">스킵</div>
            <div class="mini-value" id="last_skip">-</div>
          </div>
          <div class="mini-stat">
            <div class="mini-label">오류</div>
            <div class="mini-value err" id="last_error">-</div>
          </div>
        </div>
        <div class="badges" style="margin-top:16px">
          <div id="indexing_status"></div>
          <div id="bm25_status"></div>
        </div>
      </div>

      <!-- col2 rows 1-3: 팀원별 업로드 파일 수 -->
      <div class="card card-team-uploads">
        <div class="chart-title">팀원별 파일 수 (인덱싱 기준)</div>
        <div id="user-chart"></div>
      </div>

      <!-- col3 row1: 인덱싱된 파일 수 -->
      <div class="card card-total-files accent-blue">
        <div class="label">인덱싱된 파일</div>
        <div class="value" id="total_files">-</div>
      </div>

      <!-- col4 row1: 총 청크 수 -->
      <div class="card card-chunks-count accent-purple">
        <div class="label">총 청크 수</div>
        <div class="value" id="total_chunks">-</div>
      </div>

      <!-- col3+4 rows 2-4: 인덱싱 대기 파일 수 + 확장자별 분포 -->
      <div class="card-right-col">
        <div class="card card-pending accent-blue">
          <div class="label">인덱싱 대기 파일</div>
          <div style="margin-top:8px;">
            <div class="value md" id="pending_files">-</div>
          </div>
        </div>
        <div class="card card-ext">
          <div class="chart-title">확장자별 분포</div>
          <div id="ext-chart"></div>
        </div>
      </div>

      <!-- col1 row4: 마지막 인덱싱 -->
      <div class="card-times">
        <div class="card card-indexed accent-orange">
          <div class="label">마지막 인덱싱</div>
          <div style="display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:4px">
            <div class="value md" id="last_indexed">-</div>
            <button class="btn-secondary" onclick="reindex()">reindex</button>
          </div>
        </div>
      </div>

      <!-- col2 row4: BM25 rebuild -->
      <div class="card card-rebuild accent-green">
        <div class="label">BM25 rebuild</div>
        <div style="display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:4px">
          <div class="value md" id="last_rebuild">-</div>
          <button class="btn-primary" onclick="rebuildBm25()">BM25 rebuild</button>
        </div>
      </div>

    </div>

    <div class="refresh-info" id="refresh_info"></div>
  </div>

  <div id="toast"></div>

  <script>
    function fmt(iso) {
      if (!iso) return '-';
      return iso.replace('T', ' ').slice(0, 19);
    }
    function numFmt(n) {
      return n == null ? '-' : n.toLocaleString();
    }
    function toast(msg) {
      const el = document.getElementById('toast');
      el.textContent = msg;
      el.style.opacity = 1;
      setTimeout(() => el.style.opacity = 0, 2500);
    }

    function render(d) {
      document.getElementById('total_files').textContent  = numFmt(d.total_files);
      document.getElementById('total_chunks').textContent = numFmt(d.total_chunks);
      document.getElementById('last_indexed').textContent = fmt(d.last_indexed);
      document.getElementById('last_rebuild').textContent = fmt(d.last_rebuild);
      document.getElementById('pending_files').textContent = numFmt(d.pending_files);

      document.getElementById('bm25_status').innerHTML =
        d.bm25_loaded
          ? '<span class="badge ok">BM25 로드됨</span>'
          : '<span class="badge warn">BM25 미로드</span>';
      document.getElementById('indexing_status').innerHTML =
        d.indexing_now
          ? '<span class="badge busy">인덱싱 중</span>'
          : '<span class="badge ok">대기 중</span>';

      const watcherEl = document.getElementById('svc-watcher');
      if (d.watcher_active === true)       watcherEl.className = 'svc-pill active';
      else if (d.watcher_active === false) watcherEl.className = 'svc-pill inactive';
      else                                 watcherEl.className = 'svc-pill unknown';

      // 링
      const circ = 2 * Math.PI * 50;
      const s = d.last_success ?? 0, sk = d.last_skip ?? 0, er = d.last_error ?? 0;
      const total = s + sk + er;
      const rate  = total > 0 ? parseFloat((s / total * 100).toFixed(1)) : null;
      const track = document.getElementById('ring-track');
      const label = document.getElementById('ring-label');
      if (rate != null) {
        const filled = circ * rate / 100;
        track.setAttribute('stroke-dasharray', `${filled} ${circ}`);
        const color = rate >= 95 ? '#4ade80' : rate >= 80 ? '#60a5fa' : rate >= 60 ? '#fb923c' : '#f87171';
        track.setAttribute('stroke', color);
        label.textContent = rate.toFixed(1) + '%';
      } else {
        track.setAttribute('stroke-dasharray', `0 ${circ}`);
        label.textContent = '-';
      }

      // 누적 바
      if (total > 0) {
        const segs = document.querySelectorAll('#stack-bar .seg');
        segs[0].style.width = (s  / total * 100).toFixed(1) + '%';
        segs[1].style.width = (sk / total * 100).toFixed(1) + '%';
        segs[2].style.width = (er / total * 100).toFixed(1) + '%';
      }
      document.getElementById('legend-success').textContent = `성공 ${numFmt(s)}`;
      document.getElementById('legend-skip').textContent    = `스킵 ${numFmt(sk)}`;
      document.getElementById('legend-error').textContent   = `오류 ${numFmt(er)}`;
      document.getElementById('last_skip').textContent  = numFmt(d.last_skip);
      document.getElementById('last_error').textContent = numFmt(d.last_error);

      document.getElementById('header_time').textContent = '갱신: ' + new Date().toLocaleTimeString('ko-KR');
      document.getElementById('refresh_info').textContent = '마지막 갱신: ' + new Date().toLocaleTimeString('ko-KR') + '  (30초 자동 갱신)';

      // 확장자별 차트 (0.5% 미만 → etc 묶음)
      const extColors = ['#1e293b','#475569','#64748b','#94a3b8','#cbd5e1','#e2e8f0'];
      const extData = {};
      let etcCount = 0;
      const extTotal = Object.values(d.ext_counts || {}).reduce((a, b) => a + b, 0);
      Object.entries(d.ext_counts || {}).forEach(([k, v]) => {
        if (extTotal > 0 && v / extTotal >= 0.005) extData[k] = v;
        else etcCount += v;
      });
      if (etcCount > 0) extData['etc'] = etcCount;
      renderBarChart('ext-chart', extData, extColors);

      // 팀원별 차트 (세로)
      const userColors = ['#6b9bd2','#7ec8a0','#c9a0dc','#f0a868','#f08080'];
      renderVBarChart('user-chart', d.user_counts, userColors);
    }

    function renderVBarChart(elId, dataObj, colors) {
      if (!dataObj) return;
      const el = document.getElementById(elId);
      const entries = Object.entries(dataObj).sort((a, b) => b[1] - a[1]);
      const max = entries[0]?.[1] || 1;
      el.innerHTML = `<div class="v-chart-wrap">${
        entries.map(([label, count], i) => `
          <div class="v-bar-col">
            <div class="v-bar-val">${count.toLocaleString()}</div>
            <div class="v-bar-fill" style="height:${(count/max*100).toFixed(1)}%;background:${colors[i%colors.length]}"></div>
            <div class="v-bar-name" title="${label}">${label}</div>
          </div>
        `).join('')
      }</div>`;
    }

    function renderBarChart(elId, dataObj, colors) {
      if (!dataObj) return;
      const el = document.getElementById(elId);
      const entries = Object.entries(dataObj).sort((a, b) => b[1] - a[1]);
      const max = entries[0]?.[1] || 1;
      el.innerHTML = entries.map(([label, count], i) => `
        <div class="bar-row">
          <div class="bar-label" title="${label}">${label}</div>
          <div class="bar-track">
            <div class="bar-fill" style="width:${(count/max*100).toFixed(1)}%;background:${colors[i % colors.length]}"></div>
          </div>
          <div class="bar-count">${count.toLocaleString()}</div>
        </div>
      `).join('');
    }

    async function load() {
      try {
        const r = await fetch('/api/stats');
        const d = await r.json();
        render(d);
      } catch(e) {
        toast('통계 로딩 실패');
      }
    }
    async function rebuildBm25() {
      try {
        await fetch('/rebuild-bm25', { method: 'POST' });
        toast('BM25 rebuild 요청 완료');
        setTimeout(load, 1000);
      } catch(e) { toast('요청 실패'); }
    }
    async function reindex() {
      try {
        const r = await fetch('/reindex', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ folder_path: '/home/k0924p3/knowledge-base/uploads' }),
        });
        const d = await r.json();
        toast(d.status === 'accepted' ? 'reindex 요청 완료' : '요청 실패: ' + (d.message || ''));
        if (d.status === 'accepted') setTimeout(load, 1000);
      } catch(e) { toast('요청 실패'); }
    }
    load();
    setInterval(load, 30000);
  </script>
</body>
</html>
